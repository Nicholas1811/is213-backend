[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-worker"
version = "0.1.0"
description = "Concept quality checks for Lexical JSON"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pytest>=8.0",
  "httpx>=0.27",
  "openai>=1.0.0",
  "aio-pika>=9.0.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "joblib>=1.4",
  "scikit-learn>=1.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
