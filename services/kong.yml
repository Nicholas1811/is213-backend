_format_version: "3.0"
_transform: true

services:
  - name: payment-service
    url: http://payment-service:8080
    routes:
      - name: payment-route
        paths:
          - /payment
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: keycloak-auth
    url: http://keycloak-esd:8080
    routes:
      - name: keycloak-esd
        paths:
          - /user-auth

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: user-route
        paths:
          - /users

  - name: listing-service
    url: http://listing-service:8080
    routes:
      - name: listing-route
        paths:
          - /listings
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: proxy-cache
        config:
          strategy: memory
          request_method:
            - GET
          content_type:
            - application/json
          cache_ttl: 60

  - name: order-service
    url: http://order-service:8080
    routes:
      - name: order-route
        paths:
          - /orders
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: point-service
    url: http://point-service:8080
    routes:
      - name: point-route
        paths:
          - /points
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: purchase-product-service
    url: http://purchase-product-service:8080
    routes:
      - name: purchase-route
        paths:
          - /purchases
    plugins:
        - name: rate-limiting
          config:
            minute: 20
            policy: local
    connect_timeout: 60000
    read_timeout: 120000
    write_timeout: 60000

  - name: refund-service
    url: http://refund-service:8080
    routes:
      - name: refund-route
        paths:
          - /refund
    plugins:
        - name: rate-limiting
          config:
            minute: 20
            policy: local
    connect_timeout: 60000
    read_timeout: 120000
    write_timeout: 60000
    
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 36000
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

