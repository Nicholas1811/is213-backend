services:
  # == CORE MICROSERVICES ==
  notification-mgmt-service:
    build: ./Notificationmanagement-service
    container_name: notification-mgmt-service
    command: python consumer.py
    env_file:
      - ./.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  mock_producer:
    build: ./mock-producer
    #    expose:
    #      - "8080"
    ports:
      - "9000:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  keycloak-esd:
    build:
      context: .
      dockerfile: keycloak-user-sync-listener/Dockerfile
    env_file:
      - ./.env
    command:
      - start-dev
      - --spi-events-listener-user-sync-listener-callback-url=http://user-service:8080/events/keycloak
      - --spi-events-listener-user-sync-listener-timeout-ms=5000
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${AWS_RDS_ENDPOINT}:5432/keycloak_esd
      KC_DB_USERNAME: ${AWS_RDS_DB_USERNAME}
      KC_DB_PASSWORD: ${AWS_RDS_MASTER_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTPS_ENABLED: false
    expose:
      - "8080"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - ./.env
    expose:
      - "8080"

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    env_file:
      - ./.env
    expose:
      - "8080"
    networks:
      - temporal-network
      - default

  listing-service:
    build:
      context: ./listing-service
      dockerfile: Dockerfile
    container_name: listing-service
    env_file:
      - ./.env
    expose:
      - "8080"
    networks:
      - temporal-network
      - default
    depends_on:
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    env_file:
      - ./.env
    expose:
      - "8080"
    networks:
      - temporal-network
      - default

  point-service:
    build:
      context: ./points-service
      dockerfile: Dockerfile
    container_name: point-service
    env_file:
      - ./.env
    expose:
      - "8080"
    networks:
      - temporal-network
      - default

  point-worker:
    build:
      context: ./points-service
      dockerfile: Dockerfile
    container_name: point-worker
    environment:
      - RABBITMQ_HOST=rabbitmq
    command: python worker.py
    restart: always
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      point-service:
        condition: service_started
    networks:
      - temporal-network
      - default

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SCREEN_REPLAY_MODEL_ENABLED=true
      - SCREEN_REPLAY_MODEL_PATH=/app/training/artifacts/model.joblib
      - SCREEN_REPLAY_MODEL_REJECT_THRESHOLD=0.5
    volumes:
      - ./ai-service/training/artifacts:/app/training/artifacts:ro
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  purchase-product-service:
    build:
      context: ./PurchasedListing-service
      dockerfile: Dockerfile
    container_name: purchase-product-service
    #    env_file:
    #      - ./PurchasedListing-service/.env
    expose:
      - "8080"
    networks:
      - temporal-network

  refund-service:
    build:
      context: ./Refund-service
      dockerfile: Dockerfile
    container_name: refund-service
    expose:
      - "8080"
    networks:
      - temporal-network
      - default
    depends_on:
      - temporal
      - point-service
      - payment-service

  refund-worker:
    build:
      context: ./Refund-service
      dockerfile: Dockerfile
    container_name: refund-worker
    command: python -m worker.refund_worker
    restart: on-failure
    expose:
      - "8080"
    networks:
      - temporal-network
      - default
    depends_on:
      - temporal
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq

  purchase-worker:
    build:
      context: ./PurchasedListing-service
      dockerfile: Dockerfile
    container_name: purchase-worker
    command: python -m worker.purchase_worker
    #    env_file:
    #      - ./Refund-service/.env
    expose:
      - "8080"
    networks:
      - temporal-network
    depends_on:
      - temporal
      - point-service

  ## == Rabbit MQ ==
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## == TEMPORAL CONTAINERS ==
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:16
    networks:
      - temporal-network
    ports:
      - 5432:5432
    volumes:
      - /var/lib/postgresql/data
  temporal:
    container_name: temporal
    depends_on:
      - postgresql
    restart: on-failure
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/auto-setup:1.29.1
    networks:
      - temporal-network
    ports:
      - 7233:7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:1.29.1-tctl-1.18.4-cli-1.5.0
    networks:
      - temporal-network
    stdin_open: true
    tty: true
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.34.0
    networks:
      - temporal-network
    ports:
      - 8090:8080 # use 8090 to avoid conflict with other services

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to http://payment-service:8080/webhook
    env_file:
      - ./.env
    depends_on:
      - payment-service
    networks:
      - default
      - temporal-network
  ## == KONG API GATEWAY ==
  kong:
    image: kong:latest # Kong Gateway image (default to latest version)
    container_name: kong-api-gateway
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
      - "8002:8002"
      - "8445:8445"
      - "8003:8003"
      - "8004:8004"
    depends_on: # all exposed services to be declared here and kong.yml
      - payment-service
      - keycloak-esd
      - user-service
      - order-service
      - listing-service
      - point-service
      - purchase-product-service
      - refund-service
    networks:
      - default
      - temporal-network
networks:
  temporal-network:
    driver: bridge
    name: temporal-network

# Entrypoint for Stripe Webhook
