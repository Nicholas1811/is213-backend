services:
  notification-rabbitmq-handler:
    image: rabbitmq:3-management
    container_name: queue-container
    ports:
      - "5672:5672"
      - "15672:15672"
  notification-mgmt-service:
    build: ./Notificationmanagement-service
    container_name: notification-mgmt-service
    command: python consumer.py
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      - notification-rabbitmq-handler

  mock_producer:
    build: ./mock-producer
    ports:
      - "8080:8080"
    depends_on:
      - notification-rabbitmq-handler

  keycloak-esd:
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${AWS_RDS_ENDPOINT}:5432/keycloak_esd
      KC_DB_USERNAME: ${AWS_RDS_DB_USERNAME}
      KC_DB_PASSWORD: ${AWS_RDS_MASTER_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTPS_ENABLED: false
    expose:
      - "8080"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - ./user-service/.env
    ports:
      - "8083:8080"
  payment-service:
    build: ./payment-service
    ports:
      - "8082:8080"
    expose:
      - "8080"

  kong:
    image: kong:latest # Kong Gateway image (default to latest version)
    container_name: kong-api-gateway
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
      - "8002:8002"
      - "8445:8445"
      - "8003:8003"
      - "8004:8004"
    depends_on: # all exposed services to be declared here and kong.yml
      - payment-service
      - keycloak-esd
